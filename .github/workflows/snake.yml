name: Generate Contribution Snake

on:
schedule:
- cron: "0 0 * * *"

workflow_dispatch:

push:
branches:
- main

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest
timeout-minutes: 10

```
steps:
  - name: Generate snake animation
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: w0wzahh
      outputs: |
        dist/github-snake.svg?color_snake=ff3333&color_dots=#161b22,#21262d,#30363d,#ff3333,#ff5555
        dist/github-snake-dark.svg?palette=github-dark&color_snake=ff3333

  - name: Publish animation
    uses: crazy-max/ghaction-github-pages@v3.1.0
    with:
      build_dir: dist
      target_branch: output
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
